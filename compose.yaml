name: studenthub-413631234
services:
  mongo:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: studentAdmin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env}
    volumes:
      - mongo-data:/data/db
      - ./docker/init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30
  backend:
    image: node:22
    working_dir: /app/BackEndExample
    command: sh -c "npm install && npx tsc && node build/app.js"
    ports:
      - "127.0.0.1:8877:8877"
    volumes:
      - .:/app
      - backend-modules:/app/BackEndExample/node_modules
    environment:
      DBUSER: studenthub_app
      DBPASSWORD: ${MONGO_APP_PASSWORD}
      DBHOST: mongo
      DBPORT: "27017"
      DBNAME: studenthub
      DBAUTHSOURCE: studenthub
      PORT: "8877"
      LogPath: logs
      assetsPath: ../FrontEndExample/public
      HomePagePath: ../FrontEndExample/index.html
    depends_on:
      mongo:
        condition: service_healthy
volumes:
  mongo-data:
  backend-modules:
